grafana_ini:
  security:
    admin_user: "{{ admin_user_grafana }}"
    admin_password: "{{ admin_passwd_grafana }}"
    allow_embedding: true
  auth:
    anonymous:
        enabled: "true"
        org_name: "Main Org."
        org_role: "Viewer"
  server:
    http_addr: 127.0.0.1
    domain: "{{ inventory_hostname }}"
    # Only when https will be enabled
    # root_url: "https://{{ inventory_hostname }}/{{ grafana_hash }}/grafana/"


# These datasources will be automatically included into Grafana
grafana_datasources:
  - name: Galaxy
    type: influxdb
    access: proxy
    url: http://127.0.0.1:8086
    jsonData:
      version: Flux
      organization: telegraf
      defaultBucket: telegraf
      tlsSkipVerify: true
    secureJsonData:
      token: "{{ influx_api_token }}"

