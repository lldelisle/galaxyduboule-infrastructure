---
- hosts: dbservers
  become: true
  pre_tasks:
    - name: Install Dependencies
      package:
        name: 'acl'
  roles:
    - galaxyproject.postgresql
    - role: galaxyproject.postgresql_objects
      become: true
      become_user: postgres

- hosts: galaxyservers
  become: true
  vars_files:
    - secret_group_vars/all.yml
  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
  pre_tasks:
    - name: Install Dependencies
      package:
        name: ['acl', 'bzip2', 'git', 'make', 'tar', 'python3-venv', 'python3-setuptools']
    - name: Install RHEL/CentOS/Rocky specific dependencies
      package:
        name: ['tmpwatch']
      when: ansible_os_family == 'RedHat'
    - name: Install Debian/Ubuntu specific dependencies
      package:
        name: ['tmpreaper']
      when: ansible_os_family == 'Debian'
  roles:
    # - galaxyproject.repos
    - galaxyproject.slurm
    - usegalaxy_eu.apptainer
    - galaxyproject.galaxy
    - role: galaxyproject.miniconda
      become: true
      become_user: "{{ galaxy_user_name }}"
    - galaxyproject.nginx
    # - galaxyproject.proftpd
    - galaxyproject.gxadmin
    - galaxyproject.cvmfs
    - dj-wasabi.telegraf
  post_tasks:
    - name: Setup gxadmin cleanup task
      ansible.builtin.cron:
        name: "Cleanup Old User Data"
        user: galaxy # Run as the Galaxy user
        minute: "0"
        hour: "0"
        job: "SHELL=/bin/bash source {{ galaxy_venv_dir }}/bin/activate &&  GALAXY_LOG_DIR=/tmp/gxadmin/ GALAXY_ROOT={{ galaxy_root }}/server GALAXY_CONFIG_FILE={{ galaxy_config_file }} /usr/local/bin/gxadmin galaxy cleanup 60"
    
    - name: Ensure mailutils is installed for email notifications
      package:
        name: mailutils
        state: present

    - name: Create systemd drop-in directory for Galaxy
      file:
        path: /etc/systemd/system/galaxy-gunicorn.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create systemd drop-in for Galaxy failure notification
      copy:
        dest: /etc/systemd/system/galaxy-gunicorn.service.d/notify-failure.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          OnFailure=notify-failure@%n.service
      notify: reload systemd

    - name: Deploy Galaxy failure notification systemd service
      copy:
        dest: /etc/systemd/system/notify-failure@.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Notify admin of Galaxy Service Failure

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c '\
            LOCKFILE="/run/galaxy-failure-notify-%i.lock"; \
            now=$(date +%%s); \
            if [ -f "$LOCKFILE" ]; then \
              last=$(cat "$LOCKFILE"); \
              diff=$((now - last)); \
              [ $diff -lt 7200 ] && exit 0; \
            fi; \
            echo "$now" > "$LOCKFILE"; \
            echo "Galaxy service %i failed on $(hostname) at $(date)" | /usr/bin/mail -r galaxy@$(hostname) -s "Galaxy Service Failure" olusegun.adebayo@college-de-france.fr'
      notify: reload systemd
    - name: Deploy CVMFS watchdog service
      copy:
        dest: /etc/systemd/system/cvmfs-watchdog.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Check and recover CVMFS mounts
          After=autofs.service

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c '\
            stat /cvmfs/data.galaxyproject.org > /dev/null 2>&1 || \
            (/usr/bin/cvmfs_config umount && \
             /bin/systemctl restart autofs && \
             /usr/bin/cvmfs_config setup)'
      notify: reload systemd

    - name: Deploy CVMFS watchdog timer
      copy:
        dest: /etc/systemd/system/cvmfs-watchdog.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Periodically check CVMFS mount health

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=5min

          [Install]
          WantedBy=timers.target
      notify: reload systemd

    - name: Enable and start CVMFS watchdog timer
      systemd:
        name: cvmfs-watchdog.timer
        enabled: true
        state: started
        daemon_reload: true

